name: Build offline tracker

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "scripts/**"
      - "src/**"
      - "offline-shell.html"
      - ".github/workflows/build-offline.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-tracker-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Build self-contained HTML
        run: npm run build:offline
      - name: Install Chromium for offline smoke test
        run: npx playwright install chromium
      - name: Test with network disabled
        run: npm run test:offline
      - name: Commit generated offline tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build fully bundled offline tracker"
            git push
          fi
